<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F0E14" />
    <title>ComuniCALI | Comunidade de pessoas e RH</title>
    <style>html,body{background:#1F0E14}#boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;color:#F7F0EA;font:15px system-ui,sans-serif;text-align:center}#boot button{padding:12px 22px;border:0;border-radius:999px;background:#C9973B;color:#22100F;font:600 15px system-ui,sans-serif}</style>
    <script>
      // Se um arquivo da página não chegar, tenta de novo e, se continuar sem vir, oferece recarregar.
      addEventListener('error', function (event) {
        var tag = event.target && event.target.tagName;
        if (tag !== 'SCRIPT' && tag !== 'LINK') return;
        var tries = Number(sessionStorage.getItem('comuni-reload') || 0);
        if (tries < 4) {
          sessionStorage.setItem('comuni-reload', String(tries + 1));
          setTimeout(function () { location.reload(); }, 1500 + tries * 1500);
        } else {
          sessionStorage.removeItem('comuni-reload');
          document.getElementById('boot-text').textContent = 'Não foi possível abrir agora. Toque para tentar de novo.';
          document.getElementById('boot-button').hidden = false;
        }
      }, true);
    </script>
    <meta name="description" content="Falar de pessoas pode mudar o mundo. A ComuniCALI é uma comunidade de pessoas e de RH com encontros presenciais e online. Cadastre seu interesse." />
    <meta property="og:title" content="ComuniCALI | Comunidade de pessoas e RH" />
    <meta property="og:description" content="Falar de pessoas pode mudar o mundo. A ComuniCALI é uma comunidade de pessoas e de RH com encontros presenciais e online. Cadastre seu interesse." />
    <meta property="og:image" content="https://comuni.calirh.com/og-comunidade.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:url" content="https://comuni.calirh.com" />
    <link rel="icon" href="/brand/cali-favicon.svg" />
    <!-- Aplicativo na tela inicial: abre em tela cheia, sem a barra do navegador. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/icone-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ComuniCALI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"><div id="boot"><p id="boot-text">Carregando a ComuniCALI...</p><button id="boot-button" type="button" hidden onclick="location.reload()">Tentar de novo</button></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
